<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReBook - Campus Book Exchange</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>ReBook</h1>
    <p>Buy, sell or donate used books, notes and lab items in our college.</p>
  </header>

  <main>
    <!-- Login -->
    <section class="card login-bar">
      <p id="userInfo">You are not logged in.</p>
      <button id="loginBtn">Login with Google</button>
      <button id="logoutBtn" style="display:none;">Logout</button>
      <p id="message" class="message"></p>
    </section>

    <!-- Stats -->
    <section class="stats">
      <div class="stat-box"><h2 id="totalItems">0</h2><p>Items listed</p></div>
      <div class="stat-box"><h2 id="freeItems">0</h2><p>Free items</p></div>
      <div class="stat-box"><h2 id="moneySaved">Rs. 0</h2><p>Money saved by students</p></div>
    </section>

    <!-- Everything below is shown only after login -->
    <div id="appArea" style="display:none;">

      <!-- Add item form -->
      <section class="card">
        <h3>Add an item</h3>
        <form id="addForm">
          <input type="text" id="title" placeholder="Item name (e.g. Engineering Physics)" required>
          <input type="text" id="contact" placeholder="Phone number (optional)">

          <select id="branch">
            <option value="Common">Common (1st year)</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
            <option value="ME">ME</option>
            <option value="CE">Civil</option>
          </select>

          <select id="type">
            <option value="Book">Book</option>
            <option value="Notes">Notes</option>
            <option value="Lab Item">Lab Item</option>
            <option value="Other">Other</option>
          </select>

          <input type="number" id="originalPrice" placeholder="Original price (Rs.)" min="0" required>
          <input type="number" id="price" placeholder="Your price (Rs.) - 0 to donate" min="0" required>

          <button type="submit">Add item</button>
        </form>
      </section>

      <!-- Search and filter -->
      <section class="card">
        <h3>Find an item</h3>
        <input type="text" id="search" placeholder="Search by name...">
        <select id="filterBranch">
          <option value="All">All branches</option>
          <option value="Common">Common (1st year)</option>
          <option value="CSE">CSE</option>
          <option value="IT">IT</option>
          <option value="ECE">ECE</option>
          <option value="ME">ME</option>
          <option value="CE">Civil</option>
        </select>
        <label><input type="checkbox" id="onlyFree"> Show only free items</label>
      </section>

      <!-- Items list -->
      <section id="itemList" class="item-list"></section>
    </div>
  </main>

  <footer>
    <p>Made by a first year student for a college hackathon.</p>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
